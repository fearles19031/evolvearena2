print("EvolveArena web 0.9.3")

import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#05060c"

    bundle = "game"
    appdir = Path(f"/data/data/{bundle}")
    appdir.mkdir()

    platform.window.evoStatus("Oyun açılıyor...")
    import tarfile
    async with platform.fopen("game.tar.gz", "rb") as archive:
        tar = tarfile.open(fileobj=archive, mode="r:gz")
        tar.extractall(path=appdir.as_posix(), filter='tar')
        tar.close()

    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)

    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"
    __import__(__name__).__file__ = main

    # iPhone sesi yalnız bir dokunuştan sonra açar: "DOKUN" ekranı
    if not platform.window.MM.UME:
        platform.window.evoAskTap()
        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    platform.window.evoStatus("Hazırlanıyor...")
    await TopLevel_async_handler.start_toplevel(platform.shell, console=False)
    __import__(__name__).__file__ = main

    def ui_callback(pkg):
        platform.window.evoStatus("Yükleniyor: " + str(pkg))

    await shell.source(main, callback=ui_callback)
    print("evo.tmpl: done")

asyncio.run( custom_site() )

function evoFit() {
    var c = document.getElementById("canvas");
    if (!c) return;
    var W = window.innerWidth, H = window.innerHeight;
    var ar = (c.width > 16 && c.height > 16) ? (c.width / c.height) : (16 / 9);
    var w = W, h = w / ar;
    if (h > H) { h = H; w = h * ar; }
    w = Math.round(w); h = Math.round(h);
    c.style.position = "absolute";
    c.style.margin = "0";
    c.style.right = "auto"; c.style.bottom = "auto";
    c.style.width = w + "px"; c.style.height = h + "px";
    c.style.left = Math.floor((W - w) / 2) + "px";
    c.style.top = Math.floor((H - h) / 2) + "px";
}
window.evoFit = evoFit;
window.window_resize = evoFit;
window.addEventListener("resize", function(){ setTimeout(evoFit, 50); });
window.addEventListener("orientationchange", function(){ setTimeout(evoFit, 300); });
setInterval(evoFit, 1500);

// Çevrimdışı önbellek: ikinci açılıştan itibaren motor telefondan yüklenir

// iPhone: uygulamaya geri dönülünce ses yeniden açılsın
function evoResumeAudio() {
    try {
        var M = window.Module || (window.python && window.python.Module);
        var ac = M && M.SDL2 && M.SDL2.audioContext;
        if (ac && ac.state !== "running") ac.resume();
    } catch (e) {}
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) evoResumeAudio(); });
window.addEventListener("touchend", evoResumeAudio, {passive: true});
window.addEventListener("pointerup", evoResumeAudio, {passive: true});
window.addEventListener("pageshow", evoResumeAudio);

    <script type="application/javascript">
    // ---- YÜKLEME BEKÇİSİ: takılırsa NEDENİNİ ekrana yazar ----
    (function(){
        var errs = [];
        window.addEventListener("error", function(e){
            errs.push(((e && e.message) || "hata") + (e && e.filename ? " (" + e.filename.split("/").pop() + ")" : ""));
        });
        window.addEventListener("unhandledrejection", function(e){
            try { errs.push(String(e.reason && (e.reason.message || e.reason))); } catch (x) {}
        });
        function say(msg) {
            var m = document.getElementById("evo_msg");
            if (m) { m.textContent = msg; m.className = "err"; }
            var r = document.getElementById("evo_retry"); if (r) r.style.display = "inline-block";
        }
        if (location.protocol === "file:") {
            say("Bu dosya bilgisayarda çift tıklanarak açılmaz. Dosyaları GitHub'a yükle ve " +
                "https://...github.io/... linkinden aç.");
            return;
        }
        var last = "", since = Date.now(), checked = false;
        setInterval(function(){
            var sp = document.getElementById("evo_splash");
            if (!sp || sp.style.display === "none" || checked) return;
            var tp = document.getElementById("evo_tap");
            if (tp && tp.style.display === "flex") { since = Date.now(); return; }
            var p = document.getElementById("progress"), st = document.getElementById("status"),
                m = document.getElementById("evo_msg");
            var key = (p ? p.value : "") + "|" + (st ? st.textContent : "") + "|" + (m ? m.textContent : "");
            if (key !== last) { last = key; since = Date.now(); return; }
            if (Date.now() - since < 25000) return;
            checked = true;
            var found = [];
            fetch("game.tar.gz", {method: "HEAD", cache: "no-store"}).then(function(r){
                if (!r.ok) found.push("game.tar.gz bulunamadı (" + r.status + ") — dosyayı GitHub'a yükle.");
            }).catch(function(){ found.push("game.tar.gz okunamadı."); }).then(function(){
                return fetch(config.cdn + "pythons.js", {method: "HEAD", cache: "no-store"}).then(function(r){
                    if (!r.ok) found.push("Oyun motoru sunucusu cevap vermedi (" + r.status + ").");
                }).catch(function(){ found.push("Oyun motoru indirilemedi (pygame-web.github.io): internetini kontrol et."); });
            }).then(function(){
                if (errs.length) found.push("Hata: " + errs.slice(-2).join(" | "));
                if (!found.length) found.push("İndirme çok yavaş ya da durdu. İnternetini kontrol edip yeniden dene.");
                say(found.join("  "));
            });
        }, 1000);
    })();
